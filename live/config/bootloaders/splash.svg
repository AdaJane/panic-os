<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: MIT -->
<!--
  Background of both boot menus. live-build renders it to a 640x480 PNG and
  fills in the names between @ signs. Without this file it would use its own
  splash, which carries Debian's name and artwork.

  Deliberately plain: a dark field and one line saying what this is. The
  font is the one live-build installs for the purpose.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <rect width="640" height="480" fill="#101418"/>
  <text x="40" y="72" font-family="DejaVu Sans" font-size="36" font-weight="bold" fill="#ffffff">PanicOS</text>
  <text x="40" y="100" font-family="DejaVu Sans" font-size="14" fill="#9aa4ad">@VERSION@ (@ARCHITECTURE@), based on Debian @DISTRIBUTION@</text>
</svg>
