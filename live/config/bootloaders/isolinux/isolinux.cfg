#
# Overrides live-build's isolinux.cfg, whose "timeout 0" waits for a key
# forever. A recovery stick must boot unattended. Unit: tenths of a second;
# keep in step with TIMEOUT_SECONDS in scripts/boot-menu.awk
# (tests/unit/boot-menu.bats checks it).
#
# Adapted from the isolinux.cfg template of Debian's live-build
# (/usr/share/live/build/bootloaders/isolinux/isolinux.cfg),
# Copyright (C) 2016-2020 The Debian Live team,
# Copyright (C) 2006-2015 Daniel Baumann <mail@daniel-baumann.ch>,
# and so under that project's licence rather than this repository's MIT one.
include menu.cfg
default vesamenu.c32
prompt 0
timeout 50
