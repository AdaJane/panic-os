# SPDX-License-Identifier: GPL-3.0-or-later
#
# The "Utilities" submenu that scripts/gen-boot-menu appends to the generated
# GRUB menu: the memory tester and the firmware setup screen.
#
# Adapted from the grub.cfg template of Debian's live-build
# (/usr/share/live/build/bootloaders/grub-pc/grub.cfg),
# Copyright (C) 2016-2020 The Debian Live team,
# Copyright (C) 2006-2015 Daniel Baumann <mail@daniel-baumann.ch>,
# and so under that project's licence rather than this repository's MIT one.
# The enable-flag between @ signs is filled in by live-build at build time.

submenu 'Utilities...' --hotkey=u {
	source /boot/grub/theme.cfg

	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi
}
