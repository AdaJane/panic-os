# PanicOS: never assemble RAID arrays automatically.
#
# Debian's udev rules hand every RAID member they see to `mdadm --incremental`.
# On a machine being recovered that would start a client's array, possibly
# degraded, and let it resync or update its superblocks before anyone has
# looked at it. With "AUTO -all", mdadm refuses unless an array is named here
# or the operator assembles it by hand, for example read-only:
#
#   mdadm --assemble --readonly /dev/md0 /dev/sdX1 /dev/sdY1
#
# The initramfs carries a copy of this file.
AUTO -all
